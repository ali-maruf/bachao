<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bachao App</title>
<meta name="theme-color" content="#7A1F3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* Buyer app. Layout: phone column with sticky top bar + bottom nav; from 900px a top header, list+map split and detail with sticky side panel. */
  :root { padding-top: env(safe-area-inset-top, 0px); }
  body { min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }

  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar .wrap { display: flex; align-items: center; gap: var(--s2); min-height: 60px; }
  .topbar .logo { display: none; }
  .area-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; border: 0; background: none; padding: 0 var(--s2) 0 0; cursor: pointer; text-align: left; min-width: 0; }
  .area-btn .lbl { display: grid; line-height: 1.2; min-width: 0; }
  .area-btn small { color: var(--muted); font-size: 12px; }
  .area-btn b { font: 600 17px/1.2 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .area-btn .icon { color: var(--primary); }
  .topbar .spacer { flex: 1; }
  .topbar .desk-nav { display: none; gap: var(--s1); }
  .topbar .desk-nav a { padding: var(--s2) var(--s3); border-radius: var(--r-md); color: var(--ink); text-decoration: none; font-weight: 500; }
  .topbar .desk-nav a[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
  @media (min-width: 900px) { .topbar .logo { display: inline-flex; margin-right: var(--s4); } .topbar .desk-nav { display: flex; } }

  .offline-banner { background: var(--warn-bg); color: var(--warn); font-size: 14px; font-weight: 500; }
  .offline-banner .wrap { display: flex; gap: var(--s2); align-items: center; padding-block: var(--s2); }

  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 900px) { main { padding-bottom: var(--s8); } }

  /* bottom nav */
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .bottom-nav a { display: grid; justify-items: center; gap: 2px; min-height: 56px; align-content: center; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; position: relative; }
  .bottom-nav a .icon { width: 24px; height: 24px; }
  .bottom-nav a[aria-current="page"] { color: var(--primary); }
  .bottom-nav a[aria-current="page"] .icon { fill: var(--primary-soft); }
  .bottom-nav a[aria-current="page"]::before { content: ""; position: absolute; top: -4px; width: 32px; height: 3px; border-radius: 0 0 3px 3px; background: var(--primary); }
  @media (min-width: 900px) { .bottom-nav { display: none; } }
  body.no-nav .bottom-nav { display: none; }

  /* discover */
  .disc-head { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s3); padding-block: var(--s4) var(--s3); }
  .disc-head h1 { font-size: clamp(24px, 4vw, 32px); }
  .toolbar { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; justify-content: space-between; }
  .seg { display: inline-flex; background: var(--sunken); border-radius: var(--r-pill); padding: 3px; }
  .seg button { min-height: 40px; padding: 0 var(--s4); border: 0; background: none; border-radius: var(--r-pill); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }
  .sort { display: inline-flex; align-items: center; gap: var(--s2); font-size: 14px; color: var(--muted); }
  .sort select { min-height: 40px; border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 0 var(--s3); font-weight: 600; color: var(--ink); }
  .chip-row { display: flex; gap: var(--s2); align-items: center; }
  .chip-row .chips { flex: 1; min-width: 0; }
  .count { font-size: 14px; color: var(--muted); }
  .results { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
  .disc-body { display: grid; gap: var(--s5); }
  .map-pane { display: none; }
  .disc-body.show-map .map-pane { display: block; }
  .disc-body.show-map .list-pane { display: none; }
  @media (min-width: 900px) {
    .disc-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
    .disc-body .map-pane, .disc-body.show-map .map-pane { display: block; position: sticky; top: 76px; }
    .disc-body.show-map .list-pane { display: block; }
    .seg { display: none; }
    .results { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (min-width: 1200px) { .disc-body { grid-template-columns: 1.4fr 1fr; } .results { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .map { position: relative; aspect-ratio: 4 / 5; max-width: 100%; border-radius: var(--r-lg); overflow: hidden; background: var(--map-land); border: 1px solid var(--line); }
  @media (min-width: 900px) { .map { aspect-ratio: 5 / 6; } }
  .map svg.base { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pin { position: absolute; transform: translate(-50%, -100%); border: 0; background: var(--surface); color: var(--ink); font: 700 14px/1 var(--font-display); padding: 8px 10px; border-radius: var(--r-pill); box-shadow: var(--sh-2); cursor: pointer; min-height: 34px; white-space: nowrap; transition: transform var(--t-base) var(--ease); }
  .pin::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--surface); border-bottom: 0; }
  .pin.sel { background: var(--primary); color: var(--on-primary); transform: translate(-50%, -100%) scale(1.12); z-index: 2; }
  .pin.sel::after { border-top-color: var(--primary); }
  .pin.out { color: var(--muted); text-decoration: line-through; }
  .you { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--focus); border: 3px solid var(--surface); box-shadow: 0 0 0 6px color-mix(in srgb, var(--focus) 25%, transparent); transform: translate(-50%, -50%); }
  .map-card { position: absolute; left: var(--s3); right: var(--s3); bottom: var(--s3); }
  .map-card .bag-card { grid-template-columns: 110px 1fr; align-items: center; padding: var(--s2); box-shadow: var(--sh-2); }
  .map-card .bag-card .photo { aspect-ratio: 1; }
  .map-card .bag-card .photo .badge-left { display: none; }
  .map-card .bag-card .body { padding: 0; gap: 4px; }
  .map-card .bag-card .foot .badge-best, .map-card .bag-card .fav { display: none; }
  .map-legend { position: absolute; top: var(--s3); left: var(--s3); background: var(--surface); border-radius: var(--r-md); padding: 4px 10px; font-size: 12px; color: var(--muted); box-shadow: var(--sh-1); }

  /* detail */
  .back-row { display: flex; align-items: center; justify-content: space-between; padding-block: var(--s2); }
  .detail { display: grid; gap: var(--s5); }
  @media (min-width: 900px) { .detail { grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); align-items: start; gap: var(--s6); } }
  .gallery { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; overflow-x: auto; scroll-snap-type: x mandatory; gap: var(--s2); border-radius: var(--r-lg); scrollbar-width: none; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery .photo { scroll-snap-align: start; border-radius: var(--r-lg); }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: var(--s2); }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .dots span.on { background: var(--primary); width: 18px; border-radius: 3px; }
  .d-main { display: grid; gap: var(--s5); min-width: 0; }
  .d-title { display: grid; gap: var(--s2); }
  .d-title .row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
  .block { display: grid; gap: var(--s3); padding-top: var(--s5); border-top: 1px solid var(--line); }
  .block h2 { font-size: 20px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: var(--s2) var(--s4); font-size: 15px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .pickup-card { display: grid; gap: var(--s3); background: var(--sunken); border-radius: var(--r-lg); padding: var(--s4); }
  .pickup-card .big { font: 700 22px/1.2 var(--font-display); }
  .countdown { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--success); }
  .countdown.later { color: var(--muted); }
  .allergens { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .mini-map { position: relative; aspect-ratio: 16 / 7; max-width: 100%; border-radius: var(--r-md); overflow: hidden; background: var(--map-land); }
  .mini-map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mini-map .pin { left: 50%; top: 58%; }
  .row-btns { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .scores { display: grid; gap: var(--s2); }
  .score { display: grid; grid-template-columns: 90px 1fr 32px; gap: var(--s3); align-items: center; font-size: 14px; }
  .bar { height: 8px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--haldi); border-radius: 4px; }
  .review { display: grid; gap: 4px; padding-block: var(--s3); border-bottom: 1px solid var(--line); }
  .review:last-child { border-bottom: 0; }
  .review .who { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .review .who b { color: var(--ink); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 52px; }
  .switch { position: relative; width: 52px; height: 32px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 16px; background: var(--line); transition: background var(--t-base); }
  .switch span::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: var(--sh-1); transition: transform var(--t-base) var(--ease); }
  .switch input:checked + span { background: var(--primary); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

  .side { display: grid; gap: var(--s4); }
  .buy-card { display: grid; gap: var(--s3); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s5); }
  .cta-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--sh-2); padding: var(--s3) max(16px, env(safe-area-inset-right, 0px)) calc(var(--s3) + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: var(--s3); align-items: center; justify-content: space-between; }
  .cta-bar .price .was, .cta-bar .price .badge { font-size: 13px; }
  .cta-bar .btn { flex: 1 1 auto; max-width: 260px; }
  .cta-sub { font-size: 12px; color: var(--muted); }
  .buy-card .cta-desk { display: none; }
  @media (min-width: 900px) {
    .side { position: sticky; top: 80px; }
    .cta-bar { display: none; }
    .buy-card .cta-desk { display: flex; }
  }

  /* checkout */
  .narrow { max-width: 640px; margin-inline: auto; display: grid; gap: var(--s5); }
  .summary { display: grid; grid-template-columns: 88px 1fr; gap: var(--s3); align-items: center; background: var(--surface); border-radius: var(--r-lg); padding: var(--s3); border: 1px solid var(--line); }
  .summary .photo { aspect-ratio: 1; }
  .summary > div { min-width: 0; display: grid; gap: 4px; }
  .stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: var(--r-pill); background: var(--surface); }
  .stepper button { width: 48px; height: 48px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--primary); }
  .stepper button:disabled { color: var(--line); cursor: not-allowed; }
  .stepper output { min-width: 32px; text-align: center; font: 700 20px/1 var(--font-display); }
  .pay-list { display: grid; gap: var(--s2); border: 0; padding: 0; margin: 0; }
  .pay-opt { position: relative; display: grid; grid-template-columns: 44px 1fr 24px; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-md); cursor: pointer; min-height: 64px; }
  .pay-opt input { position: absolute; opacity: 0; }
  .pay-opt .logo-box { width: 44px; height: 32px; border-radius: var(--r-sm); display: grid; place-items: center; font: 700 11px/1 var(--font-body); color: #fff; }
  .pay-opt .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
  .pay-opt:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
  .pay-opt:has(input:checked) .radio { border-color: var(--primary); }
  .pay-opt:has(input:checked) .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
  .pay-opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .pay-opt .t { display: grid; gap: 2px; min-width: 0; }
  .pay-opt .t small { color: var(--muted); font-size: 13px; }
  .rule { display: flex; gap: var(--s2); background: var(--warn-bg); color: var(--warn); padding: var(--s3); border-radius: var(--r-md); font-size: 14px; }
  .rule .icon { flex: none; margin-top: 2px; }
  .totals { display: grid; gap: var(--s2); }
  .totals .line { display: flex; justify-content: space-between; font-size: 15px; }
  .totals .line.total { font: 700 20px/1.2 var(--font-display); border-top: 1px dashed var(--line); padding-top: var(--s3); }
  .totals .line.saving { color: var(--success); font-weight: 600; }
  .alert { display: flex; gap: var(--s3); padding: var(--s4); border-radius: var(--r-md); background: var(--error-bg); color: var(--error); }
  .alert .icon { flex: none; width: 22px; height: 22px; }
  .alert b { display: block; }
  .alert p { color: var(--ink); font-size: 15px; }
  .fine { font-size: 13px; color: var(--muted); }

  /* OTP */
  .otp { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--s2); }
  .otp input { width: 100%; height: 56px; text-align: center; font: 700 24px/1 var(--font-display); border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
  .otp input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .phone-row { display: flex; gap: var(--s2); }
  .phone-row .cc { flex: none; display: grid; place-items: center; padding: 0 var(--s3); border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--sunken); font-weight: 600; }

  /* order / ticket */
  .done-head { display: grid; justify-items: center; text-align: center; gap: var(--s2); padding-top: var(--s4); }
  .done-head .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--success-bg); color: var(--success); display: grid; place-items: center; }
  .done-head .tick .icon { width: 30px; height: 30px; stroke-width: 3; }
  .ticket { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-2); overflow: hidden; }
  .ticket .top { padding: var(--s5); display: grid; justify-items: center; gap: var(--s3); text-align: center; }
  .qr-box { background: #FFFFFF; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line); }
  .qr-box canvas { display: block; width: 168px; height: 168px; image-rendering: pixelated; }
  .code { font: 700 52px/1 var(--font-display); letter-spacing: .18em; color: var(--primary); padding-left: .18em; }
  .tear { height: 24px; position: relative; background: radial-gradient(circle at 0 50%, var(--bg) 12px, transparent 12.5px) left / 50% 100% no-repeat, radial-gradient(circle at 100% 50%, var(--bg) 12px, transparent 12.5px) right / 50% 100% no-repeat; }
  .tear::after { content: ""; position: absolute; left: 20px; right: 20px; top: 50%; border-top: 2px dashed var(--line); }
  .ticket .bottom { padding: var(--s4) var(--s5) var(--s5); display: grid; gap: var(--s3); }
  .big-count { font: 700 28px/1.1 var(--font-display); }
  .tip { display: flex; gap: var(--s2); font-size: 14px; color: var(--muted); align-items: center; }
  .phone-num { font-weight: 600; user-select: all; }

  /* demo controls */
  .demo-btn { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 24; border: 1.5px dashed var(--muted); background: var(--surface); color: var(--muted); border-radius: var(--r-pill); min-height: 40px; padding: 0 var(--s3); font-size: 13px; font-weight: 600; cursor: pointer; }
  body:not(.on-discover) .demo-btn { display: none; }
  @media (min-width: 900px) { .demo-btn { bottom: var(--s5); } }
  .demo-inline { justify-self: center; border: 1.5px dashed var(--muted); background: none; color: var(--muted); border-radius: var(--r-pill); min-height: 40px; padding: 0 var(--s3); font-size: 13px; font-weight: 600; cursor: pointer; }
  .opt-list { display: grid; gap: var(--s2); }
  .opt-list label { display: flex; gap: var(--s3); align-items: center; min-height: 48px; padding: 0 var(--s3); border: 1.5px solid var(--line); border-radius: var(--r-md); cursor: pointer; }
  .opt-list input { width: 20px; height: 20px; accent-color: var(--primary); }
  .sheet .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); }
  .range-row { display: grid; gap: var(--s1); }
  .range-row label { display: flex; justify-content: space-between; font-weight: 600; }
  .range-row input { width: 100%; accent-color: var(--primary); min-height: 32px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Bachao home"><span id="logo-mark"></span><span>bachao</span></a>
    <button class="area-btn" id="area-btn" type="button"><span id="area-pin"></span><span class="lbl"><small data-i18n="pick_near">Bags near</small><b data-i18n="area_now">Dhanmondi 27</b></span><span id="area-chev"></span></button>
    <span class="spacer"></span>
    <nav class="desk-nav" aria-label="App">
      <a href="#discover" aria-current="page" data-i18n="nav_disc">Discover</a>
      <a href="#" data-soon data-i18n="nav_fav">Favourites</a>
      <a href="#" data-soon data-i18n="nav_orders">Orders</a>
      <a href="#" data-soon data-i18n="nav_me">Me</a>
    </nav>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="bn" aria-pressed="false" lang="bn">বাং</button>
    </div>
  </div>
</header>
<div class="offline-banner" id="offline" role="status" hidden><div class="wrap"><span id="off-ic"></span><span data-i18n="offline">You're offline. Showing bags from 7:32 PM. Reserving needs a connection.</span></div></div>

<main id="view" tabindex="-1"></main>

<nav class="bottom-nav" aria-label="App">
  <a href="#discover" aria-current="page"><span data-ic="compass"></span><span data-i18n="nav_disc">Discover</span></a>
  <a href="#" data-soon><span data-ic="heart"></span><span data-i18n="nav_fav">Favourites</span></a>
  <a href="#" data-soon><span data-ic="receipt"></span><span data-i18n="nav_orders">Orders</span></a>
  <a href="#" data-soon><span data-ic="user"></span><span data-i18n="nav_me">Me</span></a>
</nav>
<button class="demo-btn" id="demo-btn" type="button" data-i18n="demo">Prototype states</button>
<div id="layer"></div>

<script src="assets/common.js" charset="utf-8"></script>
<script>
(function () {
  "use strict";
  const { t, n, tk, icon } = B;
  B.add({
    pick_near: "Bags near", area_now: "Dhanmondi 27", nav_disc: "Discover", nav_fav: "Favourites", nav_orders: "Orders", nav_me: "Me",
    offline: "You're offline. Showing bags from 7:32 PM. Reserving needs a connection.", demo: "Prototype states",
    d_h: "Tonight's bags", list: "List", map: "Map", sort_by: "Sort", s_soon: "Pickup soon", s_near: "Nearest", s_cheap: "Cheapest", s_top: "Top rated",
    f_now: "Pickup within 1 h", f_halal: "Halal", f_cheap: "Under ৳150", filters: "Filters", results: "{n} bags", map_legend: "Prices shown are tonight's bag price",

    document.querySelectorAll(".toast").forEach((t) => t.remove());
    const el = document.createElement("div");

    document.body.appendChild(el); setTimeout(() => el.remove(), 3000);

  function countdownHtml(b) {
    const now = B.nowMin();
    if (now < b.start) return '<span class="countdown later">' + icon("clock") + t("opens_in", { d: B.dur(b.start - now) }) + "</span>";
    if (now < b.end) return '<span class="countdown">' + icon("clock") + t("open_now", { d: B.dur(b.end - now) }) + "</span>";
    return '<span class="countdown later">' + t("closed") + "</span>";
  }

  /* ---------- discover ---------- */
  function filtered() {
    if (S.demo === "empty") return [];
    let list = B.bags.filter((b) => b.dist <= S.maxDist && b.price <= S.maxPrice);
    const cats = ["bakery", "sweets", "meals", "grocery", "cake"].filter((c) => S.chips.has(c));
    if (cats.length) list = list.filter((b) => cats.includes(b.cat));
    if (S.chips.has("halal")) list = list.filter((b) => b.halal);
    if (S.chips.has("cheap")) list = list.filter((b) => b.price < 150);
    if (S.chips.has("now")) list = list.filter((b) => b.start - B.nowMin() <= 60 && b.end > B.nowMin());
    const avail = (b) => b.left === 0 ? 1 : 0;
    const by = { soon: (a, b) => a.start - b.start || a.dist - b.dist, near: (a, b) => a.dist - b.dist, cheap: (a, b) => a.price - b.price, top: (a, b) => b.rating - a.rating };
    return list.sort((a, b) => avail(a) - avail(b) || by[S.sort](a, b));
  }

  /* ---------- OTP sheet ---------- */
  function openOtp(done) {
    let step = "phone", secs = 28, timer;
    const close = () => { clearInterval(timer); layer.innerHTML = ""; };
    function draw() {
      if (step === "phone") {
        layer.innerHTML = '<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="otp-h"><div class="handle"></div><div class="sheet-head"><h2 class="t-h2" id="otp-h">' + t("otp_h") + '</h2><button class="icon-btn" data-close aria-label="' + t("close") + '">' + icon("x") + "</button></div><p class=\"t-muted\">" + t("otp_p") + '</p><form id="ph-form" class="field" novalidate><label for="ph">' + t("phone") + '</label><div class="phone-row"><span class="cc">+880</span><input class="input" id="ph" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="1712 345678" value="' + S.phone + '"></div><span class="helper err" id="ph-err" hidden>' + icon("alert") + t("phone_err") + '</span><button class="btn btn-primary btn-lg btn-block" style="margin-top:8px">' + t("send_code") + "</button></form></div></div>";
        const ph = document.getElementById("ph"); ph.focus();
        document.getElementById("ph-form").addEventListener("submit", (e) => {
          e.preventDefault();
          const v = ph.value.replace(/\D/g, "");
          if (!/^1\d{9}$/.test(v)) { ph.setAttribute("aria-invalid", "true"); document.getElementById("ph-err").hidden = false; return; }
          S.phone = v; step = "otp"; draw();
        });
      } else {
        layer.innerHTML = '<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="otp-h"><div class="handle"></div><div class="sheet-head"><h2 class="t-h2" id="otp-h">' + t("otp_h2") + '</h2><button class="icon-btn" data-close aria-label="' + t("close") + '">' + icon("x") + "</button></div><p class=\"t-muted\">" + t("otp_p2", { p: n(S.phone) }) + '</p><form id="otp-form" class="field"><div class="otp">' + [0, 1, 2, 3, 4, 5].map((i) => '<input inputmode="numeric" maxlength="1" autocomplete="' + (i ? "off" : "one-time-code") + '" aria-label="Digit ' + (i + 1) + '">').join("") + '</div><span class="helper" id="otp-note"></span><button class="btn btn-primary btn-lg btn-block" style="margin-top:8px">' + t("verify") + '</button><button type="button" class="btn btn-ghost" id="chg">' + t("change_no") + "</button></form></div></div>";
        const boxes = [...layer.querySelectorAll(".otp input")], note = document.getElementById("otp-note");
        boxes.forEach((bx, i) => {
          bx.addEventListener("input", () => { bx.value = bx.value.replace(/\D/g, "").slice(-1); if (bx.value && boxes[i + 1]) boxes[i + 1].focus(); });
          bx.addEventListener("keydown", (e) => { if (e.key === "Backspace" && !bx.value && boxes[i - 1]) boxes[i - 1].focus(); });
          bx.addEventListener("paste", (e) => { const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6); if (d) { e.preventDefault(); d.split("").forEach((c, k) => { if (boxes[k]) boxes[k].value = c; }); } });
        });
        boxes[0].focus();
        timer = setInterval(() => { secs = Math.max(0, secs - 1); note.textContent = t("otp_resend", { s: n(String(secs).padStart(2, "0")) }); }, 1000);
        // Simulates Android WebOTP auto-read.
        setTimeout(() => { if (!document.body.contains(boxes[0])) return; "482193".split("").forEach((c, k) => { boxes[k].value = c; }); note.textContent = t("otp_auto"); }, 1500);
        document.getElementById("chg").addEventListener("click", () => { clearInterval(timer); step = "phone"; draw(); });
        document.getElementById("otp-form").addEventListener("submit", (e) => { e.preventDefault(); if (boxes.some((x) => !x.value)) { boxes.find((x) => !x.value).focus(); return; } S.loggedIn = true; close(); done(); });
      }
      layer.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", (e) => { if (e.target === el || el.classList.contains("icon-btn")) close(); }));
    }
    draw();
  }

  function tickOrder(b) {
    const lbl = document.getElementById("cd-label"), cd = document.getElementById("cd");
    if (!cd) return;
    const now = B.nowMin();
    if (now < b.start) { lbl.textContent = t("pickup_in"); cd.textContent = B.dur(b.start - now); }
    else if (now < b.end) { lbl.textContent = t("pickup_open"); cd.textContent = B.dur(b.end - now); }
    else { lbl.textContent = ""; cd.textContent = t("closed"); }
  }
  function drawQR(code) {
    // Visual stand-in for a real QR (production: encode the order token with a QR library).
    const c = document.getElementById("qr"), x = c.getContext("2d"), N = 29, r = B.mulberry(+code);
    x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, N, N); x.fillStyle = "#1A1114";
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (r() > .52) x.fillRect(i, j, 1, 1);
    [[0, 0], [N - 7, 0], [0, N - 7]].forEach(([a, b2]) => { x.fillStyle = "#FFFFFF"; x.fillRect(a - 1 < 0 ? a : a - 1, b2 - 1 < 0 ? b2 : b2 - 1, 9, 9); x.fillStyle = "#1A1114"; x.fillRect(a, b2, 7, 7); x.fillStyle = "#FFFFFF"; x.fillRect(a + 1, b2 + 1, 5, 5); x.fillStyle = "#1A1114"; x.fillRect(a + 2, b2 + 2, 3, 3); });
  }

  /* ---------- filters + demo sheets ---------- */
  function openFilters() {
    layer.innerHTML = '<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fl-h"><div class="handle"></div><div class="sheet-head"><h2 class="t-h2" id="fl-h">' + t("fl_h") + '</h2><button class="icon-btn" data-close aria-label="' + t("close") + '">' + icon("x") + "</button></div>" +
      '<div class="range-row"><label for="fd"><span>' + t("fl_dist") + '</span><span id="fd-v"></span></label><input type="range" id="fd" min="1" max="10" value="' + S.maxDist + '"></div>' +
      '<div class="range-row"><label for="fp"><span>' + t("fl_price") + '</span><span id="fp-v"></span></label><input type="range" id="fp" min="100" max="400" step="10" value="' + S.maxPrice + '"></div>' +
      '<div><b>' + t("fl_cat") + '</b><div class="chips" style="flex-wrap:wrap;margin-top:8px">' + CHIPS.slice(1, 6).map(([k, l]) => '<button class="chip" data-fchip="' + k + '" aria-pressed="' + S.chips.has(k) + '"><span class="check">' + icon("check") + "</span>" + t(l) + "</button>").join("") + '<button class="chip" data-fchip="halal" aria-pressed="' + S.chips.has("halal") + '"><span class="check">' + icon("check") + "</span>" + icon("moon") + t("f_halal") + "</button></div></div>" +
      '<div class="row-btns"><button class="btn btn-ghost" id="fl-clear">' + t("e_clear") + '</button><button class="btn btn-primary" style="flex:1" id="fl-apply">' + t("apply") + "</button></div></div></div>";
    const fd = document.getElementById("fd"), fp = document.getElementById("fp");
    const upd = () => { document.getElementById("fd-v").textContent = t("up_to", { v: n(fd.value) + " " + t("km") }); document.getElementById("fp-v").textContent = t("up_to", { v: tk(+fp.value) }); };
    fd.oninput = fp.oninput = upd; upd();
    layer.querySelectorAll("[data-fchip]").forEach((c) => c.addEventListener("click", () => c.setAttribute("aria-pressed", String(c.getAttribute("aria-pressed") !== "true"))));
    document.getElementById("fl-clear").onclick = () => { fd.value = 10; fp.value = 400; upd(); layer.querySelectorAll("[data-fchip]").forEach((c) => c.setAttribute("aria-pressed", "false")); };
    document.getElementById("fl-apply").onclick = () => {
      S.maxDist = +fd.value; S.maxPrice = +fp.value;
      layer.querySelectorAll("[data-fchip]").forEach((c) => { c.getAttribute("aria-pressed") === "true" ? S.chips.add(c.dataset.fchip) : S.chips.delete(c.dataset.fchip); });
      layer.innerHTML = ""; route();
    };
    bindClose();
  }
  function openDemo() {
    const states = [["normal", "st_normal"], ["empty", "st_empty"], ["offline", "st_offline"]];
    layer.innerHTML = '<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dm-h"><div class="handle"></div><div class="sheet-head"><h2 class="t-h2" id="dm-h">' + t("demo_h") + '</h2><button class="icon-btn" data-close aria-label="' + t("close") + '">' + icon("x") + '</button></div><p class="t-muted">' + t("demo_p") + '</p><div class="opt-list">' +
      states.map(([k, l]) => '<label><input type="radio" name="demo" value="' + k + '"' + (S.demo === k ? " checked" : "") + ">" + t(l) + "</label>").join("") +
      '<label><input type="checkbox" id="fail"' + (S.failNext ? " checked" : "") + ">" + t("st_fail") + "</label></div></div></div>";
    layer.querySelectorAll('input[name="demo"]').forEach((r) => r.addEventListener("change", () => { S.demo = r.value; document.getElementById("offline").hidden = S.demo !== "offline"; route(); }));
    document.getElementById("fail").addEventListener("change", (e) => { S.failNext = e.target.checked; });
    bindClose();
  }
  function setDemoRadio() { const f = document.getElementById("fail"); if (f) f.checked = S.failNext; }
  function bindClose() { layer.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", (e) => { if (e.target === el || el.classList.contains("icon-btn")) layer.innerHTML = ""; })); }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && layer.innerHTML) layer.innerHTML = ""; });

  /* ---------- events ---------- */
  view.addEventListener("click", (e) => {
    const el = e.target.closest("button, [data-act]");
    if (!el) return;
    if (el.dataset.mode) { S.mode = el.dataset.mode; renderDiscover(); }
    else if (el.dataset.chip) { const k = el.dataset.chip; S.chips.has(k) ? S.chips.delete(k) : S.chips.add(k); renderDiscover(); }
    else if (el.dataset.pin) { S.selected = +el.dataset.pin; renderDiscover(); }
    else if (el.id === "filters-btn") openFilters();
    else if (el.dataset.qty) { S.qty += +el.dataset.qty; S.payState = S.payState === "failed" ? "failed" : "idle"; renderCheckout(bagById(location.hash.split("-")[1])); }
    else if (el.id === "pay") startPay(bagById(location.hash.split("-")[1]));
    else if (el.id === "call") { const p = el.dataset.phone; (navigator.clipboard?.writeText(p) || Promise.reject()).then(() => toast(t("copied") + ": " + p), () => toast(p)); }
    else if (el.id === "cancel") toast(t("soon"));
    else if (el.dataset.act === "clear") { S.chips.clear(); S.maxDist = 10; S.maxPrice = 400; renderDiscover(); }
    else if (el.dataset.act === "widen") { S.demo = "normal"; S.maxDist = 10; renderDiscover(); }
    else if (el.dataset.act === "demo") openDemo();
    else if (el.dataset.act === "notify") toast(B.lang === "bn" ? "ঠিক আছে, ব্যাগ এলেই জানাব।" : "Done. We'll ping you when bags go live.");
  });
  view.addEventListener("change", (e) => {
    if (e.target.id === "sort") { S.sort = e.target.value; renderDiscover(); }
    if (e.target.name === "pay") { S.pay = e.target.value; if (S.payState === "failed") S.payState = "idle"; renderCheckout(bagById(location.hash.split("-")[1])); }
    if (e.target.id === "notify-shop" && e.target.checked) toast(B.lang === "bn" ? "দোকান ব্যাগ দিলেই জানাব।" : "We'll let you know when they list.");
  });
  document.querySelectorAll("[data-soon]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); toast(t("soon")); }));
  document.getElementById("area-btn").addEventListener("click", () => toast(t("soon")));
  document.getElementById("demo-btn").addEventListener("click", openDemo);

  /* ---------- router ---------- */
  let lastHash = null;
  function route() {
    document.body.classList.toggle("on-discover", !/^#(bag|checkout|order)-/.test(location.hash));
    const h = location.hash.replace("#", "") || "discover";
    const [name, id] = h.split("-");
    const b = id ? bagById(id) : null;
    if (h !== lastHash) { if (name !== "checkout") { S.payState = "idle"; } if (name === "checkout" && !lastHash?.startsWith("checkout")) S.qty = 1; }
    if (name === "bag" && b) renderDetail(b);
    else if (name === "checkout" && b) renderCheckout(b);
    else if (name === "order" && b) renderOrder(b);
    else renderDiscover();
    if (h !== lastHash) { scrollTo(0, 0); lastHash = h; }
  }
  addEventListener("hashchange", route);
  let wasDesk = matchMedia("(min-width: 900px)").matches;
  addEventListener("resize", () => { const d = matchMedia("(min-width: 900px)").matches; if (d !== wasDesk) { wasDesk = d; route(); } });
  setInterval(() => { const h = location.hash; if (h.startsWith("#order")) tickOrder(bagById(h.split("-")[1])); }, 15000);

  document.getElementById("logo-mark").innerHTML = B.logoMark;
  document.getElementById("area-pin").innerHTML = icon("pin");
  document.getElementById("area-chev").innerHTML = icon("down");
  document.getElementById("off-ic").innerHTML = icon("wifioff");
  document.querySelectorAll("[data-ic]").forEach((el) => { el.innerHTML = icon(el.dataset.ic); });
  B.onLang(() => { route(); });
  B.initLangToggle();
})();
</script>
</body>
</html>
